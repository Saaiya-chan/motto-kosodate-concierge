<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>相談の傾向｜motto 管理画面</title><link rel="stylesheet" href="/admin.css"><script type="module" src="/admin.js"></script></head><body><main><header><div><p class="eyebrow">motto 管理画面</p><h1>どんな相談が寄せられている？</h1></div><a href="/">相談画面へ</a></header><p>保存に同意した相談だけを表示します。分類はキーワードによる推定です。個別の会話は公開せず、対応と改善のために扱ってください。</p><section id="login-panel"><h2>管理者ログイン</h2><form id="login"><label for="admin-key">管理キー</label><input id="admin-key" type="password" required autocomplete="current-password"><button type="submit">ログイン</button></form><p>このMacに保存した管理キーを入力してください。</p></section><p id="notice" role="status"></p><section id="dashboard" hidden><div class="toolbar"><label>集計期間<select id="days"><option value="30">過去30日</option><option value="7">過去7日</option><option value="1">過去24時間</option></select></label><button id="reload">更新</button><button id="logout">ログアウト</button></div><div id="totals" class="totals"></div><div class="charts"><section><h2>同じ文で寄せられた質問</h2><div id="questions"></div><p class="note">表現が異なる質問を意味でまとめる集計ではありません。</p></section><section><h2>多い困りごと</h2><div id="needs"></div></section><section><h2>多い質問の種類</h2><div id="topics"></div></section><section><h2>質問で名前が出た制度</h2><div id="programs"></div></section></div><p class="note">複数の分類に当てはまる質問は、それぞれに計上します。人数ではありません。会話の文脈を推測して補完する分類は行っていません。</p><section><h2>保存された会話</h2><form id="filters" class="toolbar"><label>分類<select id="category"><option value="">すべて</option></select></label><label>質問のキーワード<input id="query" type="search" maxlength="100"></label><button type="submit">絞り込む</button></form><p id="count"></p><div id="entries"></div><div class="toolbar"><button id="previous">前へ</button><span id="page"></span><button id="next">次へ</button></div></section></section></main></body></html>
